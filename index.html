<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><script>try{let n=performance.getEntriesByType('navigation')[0];if(n&&n.type==='reload'){let u=new URL(location.href);u.searchParams.set('_fresh',Date.now());location.replace(u)}}catch(e){}</script><title>OPEN CITY 3D</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#8bb9c9;color:white;font:700 14px system-ui}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:7px;pointer-events:none;flex-wrap:wrap}.tag{background:#071727d9;border:1px solid #8beaff66;border-radius:12px;padding:9px 12px;text-shadow:0 1px 5px #000}#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}.group{display:flex;gap:8px;pointer-events:auto}.ctrl{width:60px;height:58px;border:1px solid #8beaff88;border-radius:16px;background:#071727d9;color:white;font-size:24px;font-weight:900;touch-action:none}.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#061321d9;padding:20px;text-align:center}.card{max-width:430px;padding:28px;border-radius:24px;border:1px solid #68eaff77;background:#10243a;box-shadow:0 0 55px #00dfff22}.card h1{font-size:clamp(38px,10vw,60px);line-height:.95;color:#73edff;margin:0 0 14px}.card p{color:#d0e0ec;line-height:1.55}.btn{border:0;border-radius:14px;padding:14px 24px;background:linear-gradient(120deg,#55edff,#9480ff);font-weight:900;font-size:16px;color:#071321}.note{font-size:12px;color:#9bb6c9;margin-top:15px;line-height:1.5}</style></head><body><div id="hud"><div class="tag">🏙️ OPEN CITY</div><div class="tag">🚗 <span id="spd">0</span> km/s</div><div class="tag">⭐ <span id="tasks">0</span>/5</div><div class="tag">💰 <span id="money">0</span></div></div><div id="controls"><div class="group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="group" style="flex-direction:column"><button class="ctrl" id="gas">▲</button><button class="ctrl" id="brake">▼</button></div></div><div class="panel" id="intro"><div class="card"><h1>OPEN<br>CITY</h1><p>Kiçik 3D şəhərdə sərbəst maşın sür. Küçələri gəz, trafikdən yayın və mavi halqaları toplayaraq tapşırıqları tamamla.</p><button class="btn" id="start">ŞƏHƏRƏ DAXİL OL</button><div class="note">WASD və ya ox düymələri ilə idarə et.<br>Telefonda ekrandakı düymələrdən istifadə et.</div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
(()=>{if(!window.THREE){document.querySelector('.card p').textContent='3D mühərriki yüklənmədi. İnterneti yoxlayıb yenilə.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc7d6);scene.fog=new THREE.Fog(0x9bc7d6,85,230);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputEncoding=THREE.sRGBEncoding;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe4f8ff,0x52604d,1.8));let sun=new THREE.DirectionalLight(0xfff0d2,2);sun.position.set(-35,80,40);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const M=(c,m=0,r=.7)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});const asphalt=M(0x303b46),curb=M(0x9ca6a4),grass=M(0x54785e),yellow=M(0xf2d36a),glass=M(0x31596d,.4,.2);function cube(w,h,d,mat,x,y,z,par=scene){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;par.add(o);return o}
let floor=new THREE.Mesh(new THREE.PlaneGeometry(500,500),grass);floor.rotation.x=-Math.PI/2;floor.position.y=-.15;scene.add(floor);
const spacing=34,extent=3;for(let i=-extent;i<=extent;i++){let p=i*spacing;let a=new THREE.Mesh(new THREE.PlaneGeometry(230,27),asphalt);a.rotation.x=-Math.PI/2;a.position.set(0,0,p);scene.add(a);let b=new THREE.Mesh(new THREE.PlaneGeometry(27,230),asphalt);b.rotation.x=-Math.PI/2;b.position.set(p,0,0);scene.add(b);for(let q=-110;q<115;q+=10){cube(4,.025,.13,yellow,q,.025,p);cube(.13,.025,4,yellow,p,.025,q)}}
let cityColliders=[];let colors=[0xc4b7a4,0x9aafb8,0xd1c8b8,0x788e9a,0xb7c9bf,0xb4a19b,0x8a9caa];for(let x=-extent;x<extent;x++)for(let z=-extent;z<extent;z++){let cx=(x+.5)*spacing,cz=(z+.5)*spacing;cube(25,.18,25,curb,cx,.05,cz);cube(22,.08,22,grass,cx,.18,cz);let n=1+Math.floor(Math.random()*3);for(let j=0;j<n;j++){let w=5+Math.random()*7,d=5+Math.random()*7,h=8+Math.random()*27,bx=cx+(Math.random()-.5)*12,bz=cz+(Math.random()-.5)*12;cube(w,h,d,M(colors[Math.floor(Math.random()*colors.length)]),bx,.22+h/2,bz);cityColliders.push({x:bx,z:bz,hw:w/2+.95,hd:d/2+1.75});let wm=M(0x557d8d,.1,.4);for(let yy=2.5;yy<h-1;yy+=3.5)for(let xx=-w/2+1;xx<w/2-.5;xx+=2.3)cube(.9,1.3,.035,wm,bx+xx,yy,bz-d/2-.03)}}
function car(color){let g=new THREE.Group(),paint=M(color,.45,.25);cube(1.8,.55,3.5,paint,0,.65,0,g);cube(1.42,.7,1.65,glass,0,1.2,.12,g);cube(1.5,.16,.65,paint,0,.94,-1.15,g);for(let x of [-.96,.96])for(let z of [-1.05,1.05]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.23,12),M(0x101317));w.rotation.z=Math.PI/2;w.position.set(x,.4,z);g.add(w)}for(let x of [-.58,.58]){cube(.34,.14,.05,M(0xfff1bb),x,.68,-1.77,g);cube(.34,.14,.05,M(0xff4545),x,.68,1.77,g)}return g}
let player=car(0x08b8e9);scene.add(player);let pos=new THREE.Vector3(),angle=0,v=0,keys={},active=false,score=0,money=0,hit=0;let traffic=[],rings=[];function addTraffic(){let g=car([0xe85d4a,0xe5b53b,0x6b7ce5,0xecebe2,0x4b9b65][Math.floor(Math.random()*5)]),axis=Math.random()<.5?'x':'z',dir=Math.random()<.5?1:-1,lane=Math.random()<.5?-5:5;g.position.set(axis==='x'?(Math.random()-.5)*200:lane,0,axis==='z'?(Math.random()-.5)*200:lane);g.rotation.y=axis==='x'?(dir>0?Math.PI/2:-Math.PI/2):(dir>0?0:Math.PI);scene.add(g);traffic.push({g,axis,dir,s:7+Math.random()*9})}for(let i=0;i<14;i++)addTraffic();
function addRing(){let g=new THREE.Group(),r=new THREE.Mesh(new THREE.TorusGeometry(1.15,.16,10,24),M(0x54eaff,.25,.2));r.rotation.x=Math.PI/2;g.add(r);let o=new THREE.Mesh(new THREE.OctahedronGeometry(.4),M(0xb6ffff,.4,.15));g.add(o);g.position.set((Math.floor(Math.random()*5)-2)*34,1.4,(Math.floor(Math.random()*5)-2)*34);scene.add(g);rings.push(g)}for(let i=0;i<5;i++)addRing();
function hud(){document.getElementById('spd').textContent=Math.round(Math.abs(v)*3.6);document.getElementById('tasks').textContent=score;document.getElementById('money').textContent=money}
document.getElementById('start').onclick=()=>{active=true;document.getElementById('intro').style.display='none';last=performance.now()};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function hold(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}hold('left','a');hold('right','d');hold('gas','w');hold('brake','s');
let last=performance.now();function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000,.04);last=t;if(active){if(keys.w||keys.arrowup)v=Math.min(32,v+15*dt);else if(keys.s||keys.arrowdown)v=Math.max(-8,v-19*dt);else v*=Math.pow(.988,dt*60);let turn=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(turn&&Math.abs(v)>.2)angle+=turn*dt*1.7*Math.min(1,Math.abs(v)/7)*(v>=0?1:-1);const oldX=pos.x,oldZ=pos.z;pos.x+=Math.sin(angle)*v*dt;pos.z-=Math.cos(angle)*v*dt;
 // Solid building collision: keep the car outside building footprints and apply impact.
 for(const b of cityColliders){const dx=pos.x-b.x,dz=pos.z-b.z;if(Math.abs(dx)<b.hw&&Math.abs(dz)<b.hd){const ox=b.hw-Math.abs(dx),oz=b.hd-Math.abs(dz);if(ox<oz)pos.x=b.x+Math.sign(dx||1)*b.hw;else pos.z=b.z+Math.sign(dz||1)*b.hd;if(hit<=0){v*=-.22;money=Math.max(0,money-2);hit=.55}}}
 pos.x=THREE.MathUtils.clamp(pos.x,-118,118);pos.z=THREE.MathUtils.clamp(pos.z,-118,118);player.position.copy(pos);player.rotation.y=angle;
for(let c of traffic){let p=c.g.position;if(c.axis==='x')p.x+=c.dir*c.s*dt;else p.z+=c.dir*c.s*dt;if(Math.abs(c.axis==='x'?p.x:p.z)>130){if(c.axis==='x')p.x=-130*c.dir;else p.z=-130*c.dir}const dx=pos.x-p.x,dz=pos.z-p.z,dist=Math.hypot(dx,dz);if(dist<2.65){const nx=dist>0.001?dx/dist:1,nz=dist>0.001?dz/dist:0;pos.x=p.x+nx*2.66;pos.z=p.z+nz*2.66;player.position.copy(pos);if(hit<=0){v*=-.28;money=Math.max(0,money-5);hit=.8}}}
hit=Math.max(0,hit-dt);for(let i=rings.length-1;i>=0;i--){let r=rings[i];r.rotation.y+=dt*1.8;if(r.position.distanceTo(pos)<3){scene.remove(r);rings.splice(i,1);score++;money+=25;if(score<5)addRing();else{active=false;document.querySelector('.card h1').textContent='ƏLA!';document.querySelector('.card p').textContent='5 nişanın hamısını topladın! Sərbəst sürüşə davam edə bilərsən.';document.getElementById('start').textContent='DAVAM ET';document.getElementById('intro').style.display='flex'}}}let back=new THREE.Vector3(-Math.sin(angle)*10,6.5,Math.cos(angle)*10);camera.position.lerp(pos.clone().add(back),Math.min(1,dt*4));camera.lookAt(pos.x,1,pos.z);hud()}renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();
</script></body></html>
