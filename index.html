<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Asteroid Rush</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;background:#07111f;color:#eff8ff;font:16px system-ui,sans-serif}main{width:min(100%,480px);padding:16px;border:1px solid #29415d;border-radius:20px;background:#0d1a2b}header,.stats{display:flex;justify-content:space-between;align-items:center}.tag{font-size:11px;letter-spacing:.2em;color:#65e4e8;font-weight:800}.title{font-size:24px;font-weight:900}.stats{margin:12px 0;color:#b9cce0;font-size:13px}.stats b{color:#70e6d2}canvas{width:100%;height:auto;display:block;background:#06101d;border:1px solid #243b56;border-radius:14px;touch-action:none}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}button{padding:13px 8px;border-radius:12px;border:1px solid #385574;background:#19324d;color:white;font-weight:800;font-size:15px;touch-action:manipulation}button:active{background:#28618c}#fire{color:#ffdc70}.cover{position:relative}.overlay{position:absolute;inset:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;background:#07111fee;border-radius:14px}.overlay h2{color:#69e4e7;margin:8px 0}.overlay p{font-size:14px;color:#c5d4e5;line-height:1.5;max-width:300px}#start{background:#087d70;border-color:#2bbba5;padding:12px 20px}.help{text-align:center;color:#91a9c5;font-size:12px;line-height:1.5;margin:12px 0 0}
</style></head><body><main><header><div><div class="tag">ARCADE // 001</div><div class="title">ASTEROID RUSH</div></div><div style="text-align:right"><small>XAL</small><div id="score" style="font-size:26px;font-weight:900;color:#70e6d2">0</div></div></header><div class="stats"><span>❤️ <b id="lives">3</b></span><span>LEVEL <b id="level">1</b></span><span>REKORD <b id="best">0</b></span></div><div class="cover"><canvas id="game" width="400" height="510"></canvas><div class="overlay" id="cover"><div style="font-size:48px">🚀</div><h2 id="coverTitle">ASTEROID RUSH</h2><p id="coverText">Asteroidlərdən yayın, kristalları topla və mümkün qədər çox xal qazan!</p><button id="start">OYUNA BAŞLA ▶</button></div></div><div class="controls"><button id="left">◀ SOL</button><button id="fire">⚡ ATƏŞ</button><button id="right">SAĞ ▶</button></div><p class="help">Telefonda düymələri basılı saxla və ya gəmini sahədə barmağınla hərəkət etdir. Kompüterdə ← → və Space düymələri.</p></main>
<script>
(()=>{const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d'),W=400,H=510;let ship,rocks,crystals,shots,stars,score,lives,level,frame,running=false,keys={},lastShot=0,raf=0,best=0,drag=false;try{best=+(localStorage.getItem('asteroid-rush-best')||0)}catch(e){}$('best').textContent=best;
function reset(){ship={x:200,y:445,r:15,inv:0};rocks=[];crystals=[];shots=[];score=0;lives=3;level=1;frame=0;lastShot=0;stars=Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*1.8}));hud()}function hud(){$('score').textContent=score;$('lives').textContent=lives;$('level').textContent=level}
function draw(){ctx.fillStyle='#06101d';ctx.fillRect(0,0,W,H);for(const s of stars){s.y+=s.s;if(s.y>H)s.y=0;ctx.fillStyle='rgba(190,220,255,.5)';ctx.fillRect(s.x,s.y,s.s,s.s)}for(const r of rocks){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);ctx.fillStyle='#35465a';ctx.strokeStyle='#9bafc5';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<9;i++){let a=i*Math.PI*2/9,rad=r.r*(.8+Math.sin(i*13+r.r)*.2);i?ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}for(const c of crystals){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(frame*.035);ctx.fillStyle='#5cf6c7';ctx.shadowColor='#5cf6c7';ctx.shadowBlur=15;ctx.beginPath();ctx.moveTo(0,-c.r);ctx.lineTo(c.r*.75,0);ctx.lineTo(0,c.r);ctx.lineTo(-c.r*.75,0);ctx.closePath();ctx.fill();ctx.restore()}ctx.fillStyle='#ffdc70';for(const s of shots)ctx.fillRect(s.x-2,s.y-8,4,13);if(ship&&(ship.inv<=0||Math.floor(frame/5)%2===0)){ctx.save();ctx.translate(ship.x,ship.y);ctx.fillStyle='#43d9e9';ctx.shadowColor='#29d9ff';ctx.shadowBlur=16;ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(14,15);ctx.lineTo(0,9);ctx.lineTo(-14,15);ctx.closePath();ctx.fill();ctx.fillStyle='#f9a53b';ctx.beginPath();ctx.moveTo(-5,13);ctx.lineTo(0,25+Math.random()*5);ctx.lineTo(5,13);ctx.fill();ctx.restore()}}
function spawn(){if(frame%Math.max(18,55-level*3)===0){let r=13+Math.random()*19;rocks.push({x:20+Math.random()*(W-40),y:-r,r,v:1.5+Math.random()*1.4+level*.3,rot:Math.random()*6,spin:(Math.random()-.5)*.06})}if(frame%190===0)crystals.push({x:20+Math.random()*(W-40),y:-15,r:10,v:2})}function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}
function finish(){running=false;cancelAnimationFrame(raf);if(score>best){best=score;try{localStorage.setItem('asteroid-rush-best',best)}catch(e){}}$('best').textContent=best;$('coverTitle').textContent='OYUN BİTDİ';$('coverText').textContent='Xalın: '+score+' • Rekord: '+best+'. Bir də cəhd et!';$('start').textContent='YENİDƏN OYNA ↻';$('cover').style.display='flex'}
function step(){if(!running)return;frame++;level=1+Math.floor(score/100);if(keys.left)ship.x-=4.8;if(keys.right)ship.x+=4.8;ship.x=Math.max(17,Math.min(W-17,ship.x));if(keys.fire&&frame-lastShot>12){shots.push({x:ship.x,y:ship.y-17});lastShot=frame}if(ship.inv>0)ship.inv--;spawn();for(const r of rocks){r.y+=r.v;r.rot+=r.spin}for(const c of crystals)c.y+=c.v;for(const s of shots)s.y-=8;for(let i=rocks.length-1;i>=0;i--){let r=rocks[i];if(ship.inv<=0&&hit(ship,r)){rocks.splice(i,1);lives--;ship.inv=85;if(lives<=0){hud();draw();finish();return}}else if(r.y>H+30)rocks.splice(i,1)}for(let i=crystals.length-1;i>=0;i--){let c=crystals[i];if(hit(ship,c)){score+=25;crystals.splice(i,1)}else if(c.y>H+20)crystals.splice(i,1)}for(let i=shots.length-1;i>=0;i--){let s=shots[i],found=false;for(let j=rocks.length-1;j>=0;j--){let r=rocks[j];if(Math.hypot(s.x-r.x,s.y-r.y)<r.r+4){rocks.splice(j,1);shots.splice(i,1);score+=10;found=true;break}}if(!found&&s.y<-10)shots.splice(i,1)}if(frame%30===0)score++;hud();draw();raf=requestAnimationFrame(step)}
function start(){cancelAnimationFrame(raf);reset();running=true;$('cover').style.display='none';step()}$('start').onclick=start;function hold(id,key){let b=$(id),on=e=>{e.preventDefault();keys[key]=true},off=e=>{e.preventDefault();keys[key]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)}hold('left','left');hold('right','right');hold('fire','fire');document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key===' ')keys.fire=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.key===' ')keys.fire=false});function move(e){let r=cv.getBoundingClientRect();ship.x=Math.max(17,Math.min(W-17,(e.clientX-r.left)/r.width*W))}cv.addEventListener('pointerdown',e=>{if(running){drag=true;cv.setPointerCapture(e.pointerId);move(e)}});cv.addEventListener('pointermove',e=>{if(drag&&running)move(e)});cv.addEventListener('pointerup',()=>drag=false);cv.addEventListener('pointercancel',()=>drag=false);reset();draw()})();
</script></body></html>
