<!DOCTYPE html>
<html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><script>try{const nav=performance.getEntriesByType("navigation")[0];if(nav&&nav.type==="reload"){const u=new URL(location.href);u.searchParams.set("_fresh",Date.now().toString());location.replace(u.toString())}}catch(e){}</script><title>NEON DRIVE — 3D Car Game</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b17;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:18px 20px;font-weight:800;text-shadow:0 2px 8px #000}.pill{background:#071426bb;border:1px solid #60eaff55;border-radius:14px;padding:9px 14px;backdrop-filter:blur(8px)}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050918b8;pointer-events:auto;text-align:center;padding:20px}.panel{max-width:440px;background:#0c1730ed;border:1px solid #54dfff66;border-radius:24px;padding:30px;box-shadow:0 0 60px #00d9ff20}.panel h1{font-size:clamp(30px,8vw,54px);line-height:1;margin:0 0 12px;color:#65efff;letter-spacing:2px}.panel p{color:#c5d8ee;line-height:1.5}.btn{border:0;border-radius:14px;padding:14px 24px;font-weight:900;font-size:16px;background:linear-gradient(120deg,#00d9ff,#7d5cff);color:#06101e;cursor:pointer;margin-top:8px}.controls{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:auto}.ctrl{width:68px;height:62px;border-radius:18px;background:#0a1a30b8;border:1px solid #8beaff77;color:#fff;font-size:26px;font-weight:900;touch-action: manipulation;backdrop-filter:blur(6px)}.right{display:flex;gap:12px}.hint{font-size:12px;color:#91a9c5;margin-top:14px}@media(min-width:800px){.controls{opacity:.7}.ctrl{width:60px;height:54px}}</style></head><body>
<div id="ui"><div class="top"><div class="pill">🏁 <span id="score">0</span> m</div><div class="pill">💎 <span id="coins">0</span></div><div class="pill">🏆 <span id="best">0</span></div></div><div class="controls"><button class="ctrl" id="left">◀</button><div class="right"><button class="ctrl" id="brake">▼</button><button class="ctrl" id="gas">▲</button><button class="ctrl" id="right">▶</button></div></div><div id="overlay"><div class="panel"><h1>NEON<br>DRIVE</h1><p>3D magistralda sür! Maşınları öt, kristalları topla və mümkün qədər uzağa get.</p><button class="btn" id="start">SÜRÜŞƏ BAŞLA</button><div class="hint">Klaviatura: ← → və ya A/D · ↑ sürət · ↓ əyləc<br>Telefonda ekrandakı düymələrdən istifadə et.</div></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
(()=>{const scene=new THREE.Scene();scene.background=new THREE.Color(0x071225);scene.fog=new THREE.Fog(0x071225,35,145);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,220);camera.position.set(0,5.2,10);camera.lookAt(0,0,-10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9adfff,0x182035,2));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-5,12,8);sun.castShadow=true;scene.add(sun);
const mat=(c,metal=0,rough=.5)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});
const road= new THREE.Mesh(new THREE.PlaneGeometry(13,220),mat(0x18253a));road.rotation.x=-Math.PI/2;road.position.z=-70;road.receiveShadow=true;scene.add(road);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,260),mat(0x081a25));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.position.z=-70;scene.add(ground);
const edgeMat=mat(0x00dfff,.3,.3),lineMat=mat(0x8feeff);
for(let x of [-6.55,6.55]){let e=new THREE.Mesh(new THREE.BoxGeometry(.12,.08,220),edgeMat);e.position.set(x,.04,-70);scene.add(e)}
const dashes=[];for(let z=8;z>-210;z-=10)for(let x of [-2.17,2.17]){let m=new THREE.Mesh(new THREE.BoxGeometry(.08,.025,4.3),lineMat);m.position.set(x,.025,z);scene.add(m);dashes.push(m)}
const carMat=mat(0x00c8ff,.55,.25),glass=mat(0x14283e,.5,.18),tire=mat(0x080b10),gold=mat(0xffd34e,.65,.25);
function makeCar(color=0x00c8ff){let g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(1.35,.48,2.45),mat(color,.5,.25));body.position.y=.55;body.castShadow=true;g.add(body);let hood=new THREE.Mesh(new THREE.BoxGeometry(1.15,.16,.65),mat(color,.45,.25));hood.position.set(0,.82,-.68);g.add(hood);let cabin=new THREE.Mesh(new THREE.BoxGeometry(.98,.52,1.08),glass);cabin.position.set(0,.98,.12);cabin.castShadow=true;g.add(cabin);for(let x of [-.7,.7])for(let z of [-.78,.78]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.18,12),tire);w.rotation.z=Math.PI/2;w.position.set(x,.35,z);g.add(w)}let lamps=new THREE.Mesh(new THREE.BoxGeometry(.95,.12,.05),mat(0x9ffaff,0,.2));lamps.position.set(0,.65,-1.24);g.add(lamps);return g}
const player=makeCar();player.position.set(0,0,4);scene.add(player);
const obstacles=[],gems=[],decor=[];let lane=1,speed=23,score=0,coins=0,best=Number(localStorage.getItem('neondrivebest')||0),running=false,over=false,spawn=0,gemSpawn=0,last=0;
document.getElementById('best').textContent=best;
function laneX(n){return (n-1)*3.2}
function spawnObstacle(){let l=Math.floor(Math.random()*3),car=makeCar([0xff426d,0xffa52e,0x9c70ff,0x48e28a][Math.floor(Math.random()*4)]);car.scale.set(.92,.92,.92);car.position.set(laneX(l),0,-105);scene.add(car);obstacles.push({mesh:car,lane:l})}
function spawnGem(){let l=Math.floor(Math.random()*3),m=new THREE.Mesh(new THREE.OctahedronGeometry(.48),gold);m.position.set(laneX(l),1.15,-105);scene.add(m);gems.push(m)}
function makeDecor(){for(let side of [-1,1]){let z=-105-Math.random()*55,x=side*(9+Math.random()*16),h=4+Math.random()*17;let b=new THREE.Mesh(new THREE.BoxGeometry(3+Math.random()*5,h,3+Math.random()*5),mat([0x10223c,0x152d49,0x18263d][Math.floor(Math.random()*3)]));b.position.set(x,h/2,z);scene.add(b);decor.push(b)}}for(let i=0;i<36;i++)makeDecor();
function updateUI(){document.getElementById('score').textContent=Math.floor(score);document.getElementById('coins').textContent=coins}
function endGame(){running=false;over=true;best=Math.max(best,Math.floor(score));localStorage.setItem('neondrivebest',best);document.getElementById('best').textContent=best;document.querySelector('#overlay .panel').innerHTML='<h1>OYUN BİTDİ</h1><p>🏁 Məsafə: <b>'+Math.floor(score)+' m</b><br>💎 Kristal: <b>'+coins+'</b><br>🏆 Rekord: <b>'+best+' m</b></p><button class="btn" id="start">YENİDƏN OYNA</button><div class="hint">Hazırsansa, yenidən yola çıx! 🚘</div>';document.getElementById('overlay').style.display='flex';document.getElementById('start').onclick=startGame}
function startGame(){for(let a of obstacles)scene.remove(a.mesh);for(let a of gems)scene.remove(a);obstacles.length=0;gems.length=0;lane=1;player.position.x=0;speed=23;score=0;coins=0;spawn=0;gemSpawn=0;over=false;running=true;last=performance.now();document.getElementById('overlay').style.display='none';updateUI()}
function move(d){if(running)lane=Math.max(0,Math.min(2,lane+d))}
function bind(id,fn){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();fn()})}bind('left',()=>move(-1));bind('right',()=>move(1));bind('gas',()=>speed=Math.min(38,speed+2));bind('brake',()=>speed=Math.max(14,speed-3));
document.getElementById('start').onclick=startGame;addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')speed=Math.min(38,speed+1);if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')speed=Math.max(14,speed-2);if(e.key===' '&&!running)startGame()});
function tick(t){requestAnimationFrame(tick);let dt=Math.min((t-last)/1000||0,.05);last=t;if(running){score+=dt*speed*.42;speed=Math.min(37,speed+dt*.12);spawn+=dt;gemSpawn+=dt;if(spawn>Math.max(.65,1.55-(speed-20)*.035)){spawn=0;spawnObstacle()}if(gemSpawn>1.05){gemSpawn=0;spawnGem()}
player.position.x+=(laneX(lane)-player.position.x)*Math.min(1,dt*9);player.rotation.z=(laneX(lane)-player.position.x)*-.045;
for(let d of dashes){d.position.z+=speed*dt;if(d.position.z>12)d.position.z-=220}
for(let o of obstacles){o.mesh.position.z+=speed*dt;if(Math.abs(o.mesh.position.z-player.position.z)<1.85&&Math.abs(o.mesh.position.x-player.position.x)<1.25){endGame();break}}
for(let i=obstacles.length-1;i>=0;i--)if(obstacles[i].mesh.position.z>15){scene.remove(obstacles[i].mesh);obstacles.splice(i,1)}
for(let i=gems.length-1;i>=0;i--){let g=gems[i];g.position.z+=speed*dt;g.rotation.y+=dt*2.5;if(Math.abs(g.position.z-player.position.z)<1.5&&Math.abs(g.position.x-player.position.x)<1.3){coins++;scene.remove(g);gems.splice(i,1);continue}if(g.position.z>14){scene.remove(g);gems.splice(i,1)}}
for(let b of decor){b.position.z+=speed*dt*.72;if(b.position.z>20){b.position.z=-145-Math.random()*60;b.position.x=Math.sign(b.position.x)*(9+Math.random()*16)}}
updateUI();camera.position.x+=(player.position.x*.22-camera.position.x)*dt*2;camera.lookAt(player.position.x*.12,0,-9)}
renderer.render(scene,camera)}
requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();</script></body></html>
