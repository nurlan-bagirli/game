<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON RUNNER — 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070914;color:#eef5ff;font:15px system-ui,sans-serif;overflow:hidden}#game{position:fixed;inset:0}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:18px;z-index:2}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:900;letter-spacing:4px;text-shadow:0 0 16px #00eaff}.brand span{color:#ff5bdb}.stats{display:flex;gap:8px}.stat{background:#0c1226c9;border:1px solid #3d5074;border-radius:10px;padding:8px 12px;font:12px ui-monospace,monospace;color:#a9c4e9}.stat b{display:block;color:#fff;font-size:19px;margin-top:2px}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(90%,500px);background:#080d20e8;border:1px solid #3c5c87;border-radius:18px;padding:26px;box-shadow:0 0 60px #00c9ff22;pointer-events:auto}.center h1{font-size:clamp(28px,7vw,46px);margin:0 0 8px;letter-spacing:2px}.center p{color:#b1c2dc;line-height:1.6}.btn{background:linear-gradient(100deg,#60f2ed,#c66bfa);color:#091020;border:0;border-radius:10px;padding:13px 22px;font-weight:900;cursor:pointer}.hint{font-size:12px;color:#8fa5c8;margin-top:14px}.bottom{display:flex;justify-content:space-between;align-items:end}.mobile{display:none;gap:10px;pointer-events:auto}.mobile button{width:62px;height:54px;border:1px solid #8adfff77;border-radius:14px;background:#111b35c9;color:white;font-size:24px;backdrop-filter:blur(8px)}.mobile .jump{background:#653d8cc9}@media(max-width:700px){#ui{padding:12px}.brand{font-size:12px}.stats{gap:5px}.stat{padding:6px 8px;font-size:10px}.stat b{font-size:15px}.mobile{display:flex}.bottom{align-items:end}.hintdesktop{display:none}}
</style></head><body><div id="game"></div><div id="ui"><div class="top"><div class="brand">NEON <span>RUNNER</span><div style="font-size:10px;color:#93a9ca;letter-spacing:2px;margin-top:5px">3D ENDLESS DASH</div></div><div class="stats"><div class="stat">XAL <b id="score">0</b></div><div class="stat">REKORD <b id="best">0</b></div></div></div><div class="bottom"><div class="hint hintdesktop">← → zola dəyiş · ↑ / SPACE tullan · ↓ sürüş</div><div class="mobile"><button id="left">←</button><button class="jump" id="jump">↑</button><button id="slide">↓</button><button id="right">→</button></div></div></div>
<div class="center" id="overlay"><div class="brand" style="margin-bottom:12px">NEON <span>RUNNER</span></div><h1>QAÇ. TOPLA. SAĞ QAL.</h1><p>Neon tuneldə sonsuz qaçış. Maneələrdən yayın, enerji kristallarını topla və sürət artdıqca reflekslərini sına.</p><button class="btn" id="start">OYUNA BAŞLA</button><div class="hint">Klaviatura: ← → zolaq · SPACE tullan · ↓ sürüş</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const root=document.getElementById('game'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
if(!window.THREE){overlay.innerHTML='<h1>3D mühərriki yüklənmədi</h1><p>İnternet bağlantısını yoxlayıb səhifəni yenilə.</p>';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070914);scene.fog=new THREE.Fog(0x070914,18,90);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);camera.position.set(0,5.3,10.5);camera.lookAt(0,1,-8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x8fbfff,0x161126,1.5));const key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(-4,9,5);key.castShadow=true;scene.add(key);
const mat=(color,em=0)=>new THREE.MeshStandardMaterial({color,metalness:.35,roughness:.35,emissive:color,emissiveIntensity:em});
const floorMat=mat(0x111a30,.15),cyan=mat(0x21d9ee,1.5),pink=mat(0xf448c9,1.2),gold=mat(0xffd45a,1.4),blockMat=mat(0x713f9d,.55);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,140),floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(0,-.08,-48);floor.receiveShadow=true;scene.add(floor);
const lanes=[-2.4,0,2.4],runner=new THREE.Group();scene.add(runner);const body=new THREE.Mesh(new THREE.BoxGeometry(.75,1.05,.55),mat(0x42e5ed,.65));body.position.y=.85;body.castShadow=true;runner.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.29,16,12),mat(0xf6f8ff,.2));head.position.y=1.55;runner.add(head);const visor=new THREE.Mesh(new THREE.BoxGeometry(.42,.12,.08),pink);visor.position.set(0,1.57,-.25);runner.add(visor);runner.position.z=2;
const rails=[];for(let x of [-4.1,4.1]){const r=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,130),cyan);r.position.set(x,.08,-48);scene.add(r);rails.push(r)}
const stripes=[];for(let z=5;z>-115;z-=5){for(let x of [-1.2,1.2]){const s=new THREE.Mesh(new THREE.BoxGeometry(.035,.025,2.1),mat(0x34496c,.25));s.position.set(x,.01,z);scene.add(s);stripes.push(s)}}
let objects=[],lane=1,y=0,vy=0,sliding=0,active=false,over=false,score=0,speed=18,spawn=0,last=0,best=0;
try{best=Number(localStorage.getItem('neonBest')||0)}catch(e){}bestEl.textContent=best;
function addObstacle(z){const ln=Math.floor(Math.random()*3),kind=Math.random()<.63?'barrier':'gate';const mesh=new THREE.Mesh(kind==='barrier'?new THREE.BoxGeometry(1.45,1.5,.9):new THREE.BoxGeometry(1.5,2.5,.45),kind==='barrier'?blockMat:pink);mesh.position.set(lanes[ln],kind==='barrier'?.75:1.25,z);mesh.castShadow=true;scene.add(mesh);objects.push({mesh,lane:ln,kind,hit:false});if(Math.random()<.55){const cl=Math.floor(Math.random()*3),coin=new THREE.Mesh(new THREE.OctahedronGeometry(.38),gold);coin.position.set(lanes[cl],1.25,z-7);scene.add(coin);objects.push({mesh:coin,lane:cl,kind:'coin',hit:false})}}
function reset(){for(const o of objects)scene.remove(o.mesh);objects=[];lane=1;y=0;vy=0;sliding=0;score=0;speed=18;spawn=.6;runner.position.set(0,0,2);scoreEl.textContent=0;over=false;active=true;last=performance.now();overlay.style.display='none'}
function end(){active=false;over=true;best=Math.max(best,Math.floor(score));bestEl.textContent=best;try{localStorage.setItem('neonBest',best)}catch(e){}overlay.innerHTML='<div class="brand">NEON <span>RUNNER</span></div><h1>OYUN BİTDİ</h1><p>Xalın: <b>'+Math.floor(score)+'</b><br>Rekord: <b>'+best+'</b></p><button class="btn" id="again">YENİDƏN OYNA</button><div class="hint">Bir az da irəli gedə bilərdin… 😉</div>';overlay.style.display='block';document.getElementById('again').onclick=reset}
function move(d){if(!active)return;lane=Math.max(0,Math.min(2,lane+d))}
function jump(){if(active&&y<=.01){vy=9.5;sliding=0}}
function slide(){if(active)sliding=.65}
function action(k){if(k==='ArrowLeft'||k==='a')move(-1);if(k==='ArrowRight'||k==='d')move(1);if(k==='ArrowUp'||k===' '||k==='w')jump();if(k==='ArrowDown'||k==='s')slide()}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();action(e.key)});document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.getElementById('jump').onclick=jump;document.getElementById('slide').onclick=slide;
let touchX=null;renderer.domElement.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});renderer.domElement.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>35)move(dx>0?1:-1);else jump();touchX=null},{passive:true});
function update(dt){if(!active)return;score+=dt*speed*.75;speed=Math.min(34,18+score/180);scoreEl.textContent=Math.floor(score);runner.position.x+=(lanes[lane]-runner.position.x)*Math.min(1,dt*12);if(y>0||vy>0){y+=vy*dt;vy-=23*dt;if(y<0){y=0;vy=0}}if(sliding>0)sliding-=dt;runner.position.y=y;runner.scale.y=sliding>0?.55:1;body.position.y=sliding>0?.55:.85;head.visible=sliding<=0;
spawn-=dt;if(spawn<=0){addObstacle(-75);spawn=Math.max(.48,1.25-(speed-18)*.035)+Math.random()*.35}
for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.mesh.position.z+=speed*dt;if(o.kind==='coin'&&o.lane===lane&&Math.abs(o.mesh.position.z-2)<1.15&&!o.hit){o.hit=true;score+=25;scene.remove(o.mesh);objects.splice(i,1);continue}
if(o.kind!=='coin'&&!o.hit&&o.lane===lane&&Math.abs(o.mesh.position.z-2)<1.1){const safe=o.kind==='barrier'?y>1.15:sliding>0;if(!safe){end();return}o.hit=true}
if(o.mesh.position.z>12){scene.remove(o.mesh);objects.splice(i,1)}}
for(const s of stripes){s.position.z+=speed*dt;if(s.position.z>8)s.position.z-=120}
}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);renderer.render(scene,camera)}requestAnimationFrame(loop);
document.getElementById('start').onclick=reset;addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
